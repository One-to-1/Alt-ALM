spring.application.name=bff

# ALM connection. Configure ONE of:
#   alt-alm.alm.credentials-file=../Secrets/ALM_API_credentials.json   (local dev; file wins)
#   alt-alm.alm.url / .api-key / .api-secret / .domain / .project      (injected env vars)
# Startup fails with a clear message if neither is set. Nothing contacts ALM until the first request.
#alt-alm.alm.credentials-file=../Secrets/ALM_API_credentials.json

# Pool defaults live in AlmProperties. max-size is OUR politeness limit, not a server cap:
# probe 10 held 50 concurrent sessions on one API key with no eviction, and REST sessions
# consume no licence seat.
#alt-alm.alm.pool.max-size=8
#alt-alm.alm.pool.max-idle=PT60M

# Actuator: health only. /env and /configprops would render AlmProperties - including the API
# secret - so they stay off. This is a security control, not a default we happened to keep.
management.endpoints.web.exposure.include=health

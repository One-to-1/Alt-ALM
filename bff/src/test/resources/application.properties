# Test-context configuration.
#
# These are FAKE values, not credentials. They exist so the Spring context can start without
# Secrets/ present - CI must be able to run the full every-commit suite with no sandbox access
# (test-strategy §7). Nothing in the default suite opens a session, so these are never used to
# authenticate: the pool logs in lazily on first borrow, and only the contract tests borrow.
#
# The contract tests do NOT read these. They load the real credentials themselves via AlmSandbox.
alt-alm.alm.url=https://alm.invalid/qcbin
alt-alm.alm.api-key=test-client-id-not-a-real-key
alt-alm.alm.api-secret=test-secret-not-a-real-secret
alt-alm.alm.domain=TEST_DOMAIN
alt-alm.alm.project=TEST_PROJECT

# Keep the scheduler from firing during a test run. It would be a no-op anyway (empty pool),
# but an explicit long delay makes that independent of timing.
alt-alm.alm.pool.keepalive-interval=PT1H
